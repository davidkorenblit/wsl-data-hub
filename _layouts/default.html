<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full antialiased">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <!-- Google Fonts: Assistant + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Assistant', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>

  <body class="h-full bg-[#F9FAFB] text-[#111827] font-sans flex flex-col min-h-screen">

    <!-- Minimalist Navigation Bar -->
    <header class="border-b border-neutral-200 bg-white py-3 sticky top-0 z-30">
      <div class="max-w-5xl mx-auto px-4 flex items-center justify-between">
        <a href="{{ '/' | relative_url }}" class="flex items-center gap-2">
          <span class="text-lg font-bold tracking-tight text-neutral-900">WSL Data Hub</span>
          <span class="text-[11px] font-mono text-neutral-400">25/26</span>
        </a>

        <nav class="flex items-center gap-5 text-xs sm:text-sm font-medium text-neutral-600">
          <a href="{{ '/' | relative_url }}" class="hover:text-neutral-950 transition-colors">טבלת הליגה</a>
          <a href="{{ '/methodology/' | relative_url }}" class="hover:text-neutral-950 transition-colors">מתודולוגיה</a>
          <a href="{{ '/metrics/' | relative_url }}" class="hover:text-neutral-950 transition-colors">מדדים</a>
          <a href="{{ '/about/' | relative_url }}" class="hover:text-neutral-950 transition-colors">אודות</a>
        </nav>
      </div>
    </header>

    <!-- Strict Max-Width Container -->
    <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-8">
      {{ content }}
    </main>

    <!-- Minimalist Editorial Footer -->
    <footer class="border-t border-neutral-200 bg-white py-4 mt-auto text-xs text-neutral-500 font-mono">
      <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
        <div dir="rtl">
          WSL Data Hub · עונת 2025/26 · מקור נתונים: FBref
        </div>
        <div class="flex items-center gap-3 text-neutral-400">
          <a href="{{ '/' | relative_url }}" class="hover:text-neutral-700">ראשי</a>
          <span>/</span>
          <a href="{{ '/methodology/' | relative_url }}" class="hover:text-neutral-700">מתודולוגיה</a>
          <span>/</span>
          <a href="{{ '/metrics/' | relative_url }}" class="hover:text-neutral-700">מדדים</a>
        </div>
      </div>
    </footer>

  </body>
</html>
