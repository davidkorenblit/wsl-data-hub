<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full antialiased">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <!-- Immediate Theme Detection (Prevents FOUC) -->
    <script>
      (function() {
        const storedTheme = localStorage.getItem('theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme === 'dark' || (!storedTheme && systemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Google Fonts: Assistant + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN with Dark Mode Class -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Assistant', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>

  <body class="h-full bg-[#F9FAFB] dark:bg-[#09090B] text-[#111827] dark:text-[#F4F4F5] font-sans flex flex-col min-h-screen transition-colors duration-150">

    <!-- Minimalist Navigation Bar -->
    <header class="border-b border-neutral-200 dark:border-neutral-800 bg-white dark:bg-[#121215] py-3 sticky top-0 z-30 transition-colors duration-150">
      <div class="max-w-5xl mx-auto px-4 flex items-center justify-between">
        <a href="{{ '/' | relative_url }}" class="flex items-center gap-2">
          <span class="text-lg font-bold tracking-tight text-neutral-900 dark:text-white">WSL Data Hub</span>
          <span class="text-[11px] font-mono text-neutral-400 dark:text-neutral-500">25/26</span>
        </a>

        <div class="flex items-center gap-4 sm:gap-6">
          <nav class="flex items-center gap-4 sm:gap-5 text-xs sm:text-sm font-medium text-neutral-600 dark:text-neutral-300">
            <a href="{{ '/' | relative_url }}" class="hover:text-neutral-950 dark:hover:text-white transition-colors">טבלת הליגה</a>
            <a href="{{ '/methodology/' | relative_url }}" class="hover:text-neutral-950 dark:hover:text-white transition-colors">מתודולוגיה</a>
            <a href="{{ '/metrics/' | relative_url }}" class="hover:text-neutral-950 dark:hover:text-white transition-colors">מדדים</a>
            <a href="{{ '/about/' | relative_url }}" class="hover:text-neutral-950 dark:hover:text-white transition-colors">אודות</a>
          </nav>

          <!-- Theme Toggle Button -->
          <button id="theme-toggle" type="button" aria-label="החלף מצב תצוגה (Light/Dark)" class="p-1.5 rounded border border-neutral-200 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300 hover:text-neutral-900 dark:hover:text-white transition-colors text-xs">
            <span class="dark:hidden" title="מעבר למצב לילה">🌙</span>
            <span class="hidden dark:inline" title="מעבר למצב יום">☀️</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Strict Max-Width Container -->
    <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-8">
      {{ content }}
    </main>

    <!-- Minimalist Editorial Footer -->
    <footer class="border-t border-neutral-200 dark:border-neutral-800 bg-white dark:bg-[#121215] py-4 mt-auto text-xs text-neutral-500 dark:text-neutral-400 font-mono transition-colors duration-150">
      <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
        <div dir="rtl">
          WSL Data Hub · עונת 2025/26 · מקור נתונים: FBref
        </div>
        <div class="flex items-center gap-3 text-neutral-400 dark:text-neutral-500">
          <a href="{{ '/' | relative_url }}" class="hover:text-neutral-700 dark:hover:text-neutral-300">ראשי</a>
          <span>/</span>
          <a href="{{ '/methodology/' | relative_url }}" class="hover:text-neutral-700 dark:hover:text-neutral-300">מתודולוגיה</a>
          <span>/</span>
          <a href="{{ '/metrics/' | relative_url }}" class="hover:text-neutral-700 dark:hover:text-neutral-300">מדדים</a>
        </div>
      </div>
    </footer>

    <!-- Theme Toggle Handler -->
    <script>
      document.getElementById('theme-toggle')?.addEventListener('click', function() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    </script>

  </body>
</html>
