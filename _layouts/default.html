<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              rubik: ['Rubik', 'sans-serif'],
            },
            colors: {
              brand: {
                50:  '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                900: '#0c4a6e',
              },
              surface: {
                900: '#0f172a',
                800: '#1e293b',
                700: '#334155',
                600: '#475569',
              }
            }
          }
        }
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      body { font-family: 'Rubik', sans-serif; }
    </style>
  </head>

  <body class="h-full bg-surface-900 text-slate-100 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-surface-800 border-b border-surface-700 shadow-lg">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
        <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 group">
          <span class="text-2xl">⚽</span>
          <div>
            <h1 class="text-xl font-bold text-white group-hover:text-brand-500 transition-colors">
              {{ site.title }}
            </h1>
            <p class="text-xs text-slate-400">{{ site.description }}</p>
          </div>
        </a>
        <nav class="flex items-center gap-6 text-sm font-medium text-slate-300">
          <a href="{{ '/' | relative_url }}" class="hover:text-brand-400 transition-colors">טבלת הליגה</a>
          <a href="{{ '/methodology/' | relative_url }}" class="hover:text-brand-400 transition-colors">מתודולוגיה</a>
          <a href="{{ '/about/' | relative_url }}" class="hover:text-brand-400 transition-colors">אודות</a>
        </nav>
      </div>
    </header>

    <!-- Main content -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
      {{ content }}
    </main>

    <!-- Footer -->
    <footer class="bg-surface-800 border-t border-surface-700 mt-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 text-center text-sm text-slate-500">
        © {{ site.time | date: '%Y' }} WSL Data Hub · נתונים מ-FBref · כל הזכויות שמורות
      </div>
    </footer>

  </body>
</html>
