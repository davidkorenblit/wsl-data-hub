version: 2

sources:
  - name: raw
    schema: raw
    description: "Raw ingested data from the WSL Data Lake."
    tables:
      - name: matches
        description: "Raw match fixtures and scores."
      - name: standings
        description: "Raw team standings rows."
      - name: match_player_stats
        description: "Raw per-player match micro-statistics extracted from FotMob matchDetails."
      - name: shots
        description: "Raw shotmap events extracted from FotMob matchDetails."
