version: 2

models:
  - name: stg_matches
    description: "Staged raw match fixtures."
    columns:
      - name: match_id
        tests:
          - unique
          - not_null

  - name: dim_teams
    description: "Dimension table for all competing WSL clubs."
    columns:
      - name: team_slug
        tests:
          - unique
          - not_null

  - name: fct_league_standings
    description: "Final Gold analytics table for WSL standings."
    columns:
      - name: league_rank
        tests:
          - not_null
      - name: team_name
        tests:
          - unique
          - not_null
      - name: points
        tests:
          - not_null

  - name: fct_match_player_stats
    description: "Gold fact table for per-player match micro-statistics."
    columns:
      - name: player_match_key
        tests:
          - unique
          - not_null
      - name: match_id
        tests:
          - not_null
      - name: player_id
        tests:
          - not_null

  - name: fct_shots
    description: "Gold fact table for all shotmap events with coordinates and xG."
    columns:
      - name: shot_id
        tests:
          - unique
          - not_null
      - name: match_id
        tests:
          - not_null
