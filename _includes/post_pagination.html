<nav class="pt-4 border-t border-neutral-200 dark:border-neutral-800 mt-8 transition-colors" aria-label="ניווט בין עמודים">
  <div class="flex flex-col sm:flex-row items-center justify-between gap-3 text-xs font-mono">
    
    <!-- Previous Link (Right side in RTL) -->
    <div>
      {% if page.prev_url %}
      <a href="{{ page.prev_url | relative_url }}" class="text-neutral-700 dark:text-neutral-300 hover:text-neutral-950 dark:hover:text-white font-medium flex items-center gap-1.5 transition-colors">
        <span>→</span>
        <span>{{ page.prev_title | default: "לחלק הקודם" }}</span>
      </a>
      {% endif %}
    </div>

    <!-- Center / Home Link -->
    <div class="text-neutral-400 dark:text-neutral-500">
      <a href="{{ '/' | relative_url }}" class="text-neutral-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white transition-colors">
        טבלת הליגה
      </a>
    </div>

    <!-- Next Link (Left side in RTL) -->
    <div>
      {% if page.next_url %}
      <a href="{{ page.next_url | relative_url }}" class="text-neutral-700 dark:text-neutral-300 hover:text-neutral-950 dark:hover:text-white font-medium flex items-center gap-1.5 transition-colors">
        <span>{{ page.next_title | default: "לחלק הבא" }}</span>
        <span>←</span>
      </a>
      {% endif %}
    </div>

  </div>
</nav>
